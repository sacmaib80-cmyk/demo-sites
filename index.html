:root { --pale: #f4efe6; --dark: #16130f; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; min-height: 100svh; background: var(--dark); color: var(--pale); font: 400 15px/1.6 'Plex Thai', 'Noto Sans Thai', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

.thai { font: 300 clamp(34px, 9.5vw, 46px)/1.36 'Taviraj', serif; }
